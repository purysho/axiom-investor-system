# Fly.io config — see DEPLOY.md path B.
# Change `app` to your chosen name, then:
#   fly launch --copy-config --no-deploy
#   fly volumes create axiom_data --size 1
#   fly secrets set SESSION_SECRET=$(openssl rand -hex 32)
#   fly deploy
app = "axiom-investor-system"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "axiom_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
