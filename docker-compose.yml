# Axiom Investor System — one container, one volume.
#   1) echo "SESSION_SECRET=$(openssl rand -hex 32)" > .env
#   2) docker compose up -d --build
#   3) docker compose logs web | grep AXIOM-   ← first-run invite code
# Put HTTPS in front (see DEPLOY.md) before real use: session cookies are
# Secure-only in production, so plain http will not keep you signed in.
services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?run: echo "SESSION_SECRET=$(openssl rand -hex 32)" > .env}
      # Optional benchmark-quote fallback:
      # ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY}
    volumes:
      - axiom-data:/data
volumes:
  axiom-data:
